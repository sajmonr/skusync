# Compose-only nginx config for the dashboard container. Bind-mounted over
# /etc/nginx/conf.d/default.conf so the committed production nginx.conf stays unchanged.
#
# It serves the built Angular SPA and reverse-proxies /api/ to the web-api container, so the
# browser only ever talks to this origin (localhost:4200) — the API needs no published port
# and there is no cross-origin/CORS involved.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    # Strip the /api prefix and forward to the web API. The trailing slash on proxy_pass
    # replaces the matched /api/ location, so /api/item-sync → http://web-api:8080/item-sync.
    location /api/ {
        proxy_pass http://web-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
