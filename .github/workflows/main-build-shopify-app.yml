name: Build Shopify app (production)

# The .NET services are built and deployed by Dokploy from their Dockerfiles, not here. This job
# covers the Shopify app, which Dokploy knows nothing about: the extension bundle is compiled on
# whatever machine runs the Shopify CLI, so without this nothing verifies that a production build of
# it still compiles after a merge.
#
# It builds only — it does not deploy. `shopify app deploy` needs a Partners token; see the note at
# the bottom of the file.
on:
  push:
    branches:
      - main
    paths:
      - 'skusync/**'
      - '.github/workflows/main-build-shopify-app.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to main supersedes an in-flight build of an older commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skusync

jobs:
  build:
    name: Typecheck & build for production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # Pinned rather than floating: the lockfile is written by pnpm 11, and `--frozen-lockfile` is
      # only meaningful if the resolver matches what produced it.
      - name: Install pnpm
        run: npm install --global pnpm@11.20.0

      # The Shopify CLI is not a dependency of the app, so a runner has no `shopify` on PATH — the
      # command only works locally because it is installed globally there. Pinned to the version
      # developers currently run; see the note at the bottom about making this reproducible instead.
      - name: Install Shopify CLI
        run: npm install --global @shopify/cli@4.6.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # esbuild strips types without checking them, so the build below would happily succeed on code
      # that does not typecheck. This is the only place types are verified in CI.
      - name: Typecheck
        run: pnpm typecheck

      - name: Build for production
        run: pnpm build:production

      # `build:production` hardcodes NODE_ENV=production, but the whole point of that variable is
      # which API URL gets compiled into the bundle, and getting it wrong ships a bundle pointing at
      # a developer's ngrok tunnel. Assert against the artifact rather than trusting the script.
      #
      # Both URLs are always present in the bundle — they are the two entries of a lookup record — so
      # grepping for a hostname proves nothing. What matters is the value NODE_ENV folded to.
      - name: Verify the bundle resolved to production
        shell: bash
        run: |
          shopt -s nullglob
          bundles=(extensions/*/dist/*.js)

          if [[ ${#bundles[@]} -eq 0 ]]; then
            echo "::error::No extension bundle was produced by the build."
            exit 1
          fi

          for bundle in "${bundles[@]}"; do
            if grep -Eq 'try *\{ *return *"production"' "$bundle"; then
              echo "OK: $bundle resolved to the production API URL."
            else
              echo "::error file=$bundle::Bundle did not resolve NODE_ENV to production — it would" \
                   "call the development tunnel URL. Check that build:production still sets NODE_ENV."
              exit 1
            fi
          done

      - name: Upload extension bundles
        uses: actions/upload-artifact@v4.6.2
        with:
          name: shopify-extension-bundles
          path: skusync/extensions/*/dist/
          if-no-files-found: error
          retention-days: 14
# Deploying is deliberately not wired up. `shopify app deploy` creates a new app version that
# merchants receive, which wants an explicit decision rather than firing on every push to main. When
# you do want it, add a SHOPIFY_CLI_PARTNERS_TOKEN secret and a step running `pnpm deploy` — the
# script already sets NODE_ENV=production.
