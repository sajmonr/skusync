# compose.yaml — lightweight development dependencies.
#
# Runs the backing services the app needs while you develop it locally: PostgreSQL and a
# WireMock stand-in for the SkuLabs API. The application itself (web-api, app-server,
# dashboard) is NOT started here — you run those on the host with `dotnet run` /
# process-compose, pointing them at the containers below.
#
#   docker compose up -d                 # start the dev dependencies in the background
#   docker compose down                  # stop; add -v to also drop the data volumes
#
# These containers `restart: unless-stopped`, so they come back after a reboot and stay up
# until you explicitly `docker compose down` them — the intent is to leave them running all
# the time while you work.
#
# For a full end-to-end run of everything (services + the application, in a fresh
# environment), use compose.e2e.yaml instead:
#
#   docker compose -f compose.e2e.yaml up --build
#
# Host ports are deliberately non-standard so they never clash with a locally installed
# Postgres, and so this stack and compose.e2e.yaml can be up at the same time:
#   - 5434  → PostgreSQL   (e2e uses 5433; a system Postgres would use 5432)
#   - 5675  → SkuLabs mock (WireMock): API + admin + web UI on one port

name: skusync-dev

services:
  postgres:
    # 18+ is required: entity primary keys default to the built-in uuidv7() SQL function,
    # which was introduced in PostgreSQL 18.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-skusync}
    ports:
      # Non-standard host port so it never clashes with a local Postgres on 5432 or the
      # compose.e2e.yaml Postgres on 5433.
      - "5434:5432"
    volumes:
      # PostgreSQL 18+ images store data in a version-specific subdirectory and expect the
      # mount at /var/lib/postgresql (not /var/lib/postgresql/data as in <=17).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skusync}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  skulabs-mock:
    # WireMock with an integrated web UI (a community fork of the official WireMock image).
    # Stands in for the SkuLabs Items API locally. Committed stubs in ./mocks/skulabs are
    # mounted read-only and loaded on startup, so they are the immutable baseline; edits made
    # live via the web UI or admin API stay in memory and are discarded on restart. See
    # mocks/skulabs/README.md.
    image: holomekc/wiremock-gui:latest
    command: ["--verbose", "--disable-banner"]
    volumes:
      - ./mocks/skulabs/mappings:/home/wiremock/mappings:ro
      - ./mocks/skulabs/__files:/home/wiremock/__files:ro
    ports:
      # API, admin, and the web UI (/__admin/webapp) are all served on this one port.
      - "5675:8080"
    restart: unless-stopped

volumes:
  postgres-data:
