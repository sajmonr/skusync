# compose.yaml — lightweight development dependencies.
#
# Runs only the backing services the app needs while you develop it locally: PostgreSQL
# and RabbitMQ. The application itself (web-api, app-server, dashboard) is NOT started
# here — you run those on the host with `dotnet run` / process-compose, pointing them at
# the containers below.
#
#   docker compose up -d                 # start the dev dependencies in the background
#   docker compose down                  # stop; add -v to also drop the data volumes
#
# These containers `restart: unless-stopped`, so they come back after a reboot and stay up
# until you explicitly `docker compose down` them — the intent is to leave them running all
# the time while you work.
#
# For a full end-to-end run of everything (services + the application, in a fresh
# environment), use compose.e2e.yaml instead:
#
#   docker compose -f compose.e2e.yaml up --build
#
# Host ports are deliberately non-standard so they never clash with a locally installed
# Postgres/RabbitMQ, and so this stack and compose.e2e.yaml can be up at the same time:
#   - 5434  → PostgreSQL   (e2e uses 5433; a system Postgres would use 5432)
#   - 5674  → RabbitMQ AMQP (standard is 5672)
#   - 15674 → RabbitMQ management UI at http://localhost:15674 (standard is 15672)

name: skusync-dev

services:
  postgres:
    # 18+ is required: entity primary keys default to the built-in uuidv7() SQL function,
    # which was introduced in PostgreSQL 18.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-skusync}
    ports:
      # Non-standard host port so it never clashes with a local Postgres on 5432 or the
      # compose.e2e.yaml Postgres on 5433.
      - "5434:5432"
    volumes:
      # PostgreSQL 18+ images store data in a version-specific subdirectory and expect the
      # mount at /var/lib/postgresql (not /var/lib/postgresql/data as in <=17).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-skusync}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    # -management image bundles the web management UI on 15672.
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      # Non-standard host ports so they never clash with a locally installed RabbitMQ.
      - "5674:5672"    # AMQP
      - "15674:15672"  # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
