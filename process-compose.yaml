# process-compose.yaml — local dev launcher for the Web.Api HTTP host, the AppServer background
# worker, and the Angular dashboard.
#
#   process-compose -f process-compose.yaml --no-server up   # start the processes (no PC HTTP server)
#   Ctrl+C                                                    # stop them
#
# The `-f process-compose.yaml` is required: process-compose also treats `compose.yaml` as one of
# its default config names, and with both files in the repo root it would otherwise load the Docker
# Compose file and start an empty project.
#
# PostgreSQL is NOT started here — bring it up with `docker compose up -d`
# (compose.yaml: Postgres on localhost:5434). The dev connection string in
# appsettings.Development.json already points at it. Each host's Shopify / SkuLabs / AWS
# configuration still comes from its .NET user secrets, which `dotnet run` loads automatically in
# the Development environment. AppServer owns background processing (Shopify webhook handlers,
# the SQS poller, and the Hangfire recurring jobs) — the reconcile/dispatch pipeline runs here.
version: "0.5"

processes:
  web-api:
    description: "ASP.NET Core HTTP host (OpenAPI + health) on http://localhost:5257"
    working_dir: dotnet
    # No port/env overrides: the `http` launch profile in src/Web.Api/Properties/launchSettings.json
    # sets the URL (http://localhost:5257) and ASPNETCORE_ENVIRONMENT=Development, so this runs on
    # the same port as a plain `dotnet run`. The DB connection string lives in
    # src/Web.Api/appsettings.Development.json (ConnectionStrings:SkuSync).
    command: dotnet run --project src/Web.Api
    readiness_probe:
      # /_health/ready runs the Postgres check, so "ready" means the API can actually serve.
      http_get:
        host: 127.0.0.1
        port: 5257
        path: /_health/ready
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 5

  app-server:
    description: "AppServer background worker (Shopify webhooks, SQS, Hangfire jobs)"
    working_dir: dotnet
    # AppServer hosts a minimal HTTP surface for health only. Its launch profile sets
    # DOTNET_ENVIRONMENT=Development — which WebApplicationBuilder still honours — so `dotnet run`
    # loads appsettings.Development.json (the Postgres connection string) and binds the
    # health endpoints on http://localhost:5258; Shopify / SkuLabs / AWS values come from its .NET
    # user secrets.
    command: dotnet run --project src/AppServer
    readiness_probe:
      # /_health/ready runs the Postgres check, so "ready" means the worker can reach
      # its dependencies.
      http_get:
        host: 127.0.0.1
        port: 5258
        path: /_health/ready
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 5

  dashboard-install:
    description: "Install the dashboard's npm dependencies (one-shot)"
    working_dir: angular/dashboard
    command: npm install
    availability:
      # One-shot: run to completion, don't restart. `dashboard` waits for a clean exit.
      restart: no

  dashboard:
    description: "Angular dashboard (ng serve) on http://localhost:4200"
    working_dir: angular/dashboard
    command: npm start
    depends_on:
      dashboard-install:
        condition: process_completed_successfully
    readiness_probe:
      http_get:
        host: localhost
        port: 4200
        path: /
      initial_delay_seconds: 10
      period_seconds: 5
      timeout_seconds: 3
      failure_threshold: 30
    availability:
      restart: on_failure
      max_restarts: 5
